# ============================================
# 推送通道配置文件模板 / config.template.yaml
# 复制为 config.yaml 并填入真实配置。
# config.yaml 在 .gitignore 中排除。
# ============================================

# 当前激活的通道: wecom / dingtalk / email / bark
active_channel: wecom

# 通道详情（仅需填写激活通道的配置）
channels:
  wecom:
    webhook_url: ""       # 企业微信群机器人 Webhook URL
  dingtalk:
    webhook_url: ""       # 钉钉群机器人 Webhook URL
  email:
    smtp_host: smtp.qq.com
    smtp_port: 465
    sender: ""            # 发件邮箱
    auth_code: ""         # SMTP 授权码
    receiver: ""          # 收件邮箱
  bark:
    key: ""               # Bark App 推送 Key
